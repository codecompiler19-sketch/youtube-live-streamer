name: YouTube Live Streamer

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # Run automatically every 6 hours

permissions:
  contents: read
  actions: write

jobs:
  stream:
    name: Stream to YouTube Live
    runs-on: ubuntu-latest
    timeout-minutes: 360 # GitHub hard limit for single job execution (6 hours)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Deno (JavaScript Runtime for yt-dlp)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v1.x

      - name: Install FFmpeg & System Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade --pre "yt-dlp[default]"

      - name: Prepare YouTube cookies
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          if [ -n "$YOUTUBE_COOKIES_B64" ]; then
            echo "# Netscape HTTP Cookie File" > "$RUNNER_TEMP/youtube-cookies.txt"
            printf '%s' "$YOUTUBE_COOKIES_B64" | base64 -d >> "$RUNNER_TEMP/youtube-cookies.txt" 2>/dev/null || printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode >> "$RUNNER_TEMP/youtube-cookies.txt"
            chmod 600 "$RUNNER_TEMP/youtube-cookies.txt"
            echo "YOUTUBE_COOKIE_FILE=$RUNNER_TEMP/youtube-cookies.txt" >> "$GITHUB_ENV"
            echo "🍪 YouTube cookies configured successfully."
          else
            echo "ℹ️ YOUTUBE_COOKIES_B64 secret is not set. Running with TV/iOS player clients."
          fi

      - name: Execute Live Stream
        env:
          YOUTUBE_STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
          YOUTUBE_RTMPS_URL: ${{ secrets.YOUTUBE_RTMPS_URL }}
          YOUTUBE_COOKIE_FILE: ${{ env.YOUTUBE_COOKIE_FILE }}
        run: |
          python stream.py

      - name: Auto-Restart Stream Workflow
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "🔄 Dispatching next 6-hour streaming session automatically..."
          gh workflow run stream.yml
